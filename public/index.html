<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Google Photos — Find the memory, not just the photo.">
  <meta name="theme-color" content="#ffffff">
  <title>Google Photos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ====================================================================
       TOP SEARCH BAR (persistent, first thing the user sees)
       ==================================================================== -->
  <header class="gp-top-bar" id="gpTopBar">
    <div class="gp-top-bar-inner">
      <!-- Search bar is the primary interaction on the first screen -->
      <div class="gp-search-bar" id="gpSearchBar">
        <svg class="gp-search-bar-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          class="gp-search-input" 
          placeholder="Search your photos"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" class="gp-search-clear" id="btnClearSearch" aria-label="Clear" style="display:none">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>

      <!-- Right side: Google Photos brand + avatar -->
      <div class="gp-top-right">
        <div class="gp-brand-logo" title="Google Photos" id="btnGoHome">
          <svg viewBox="0 0 40 40" width="28" height="28" fill="none">
            <path d="M20 0C20 11.0457 11.0457 20 0 20C11.0457 20 20 28.9543 20 40C20 28.9543 28.9543 20 40 20C28.9543 20 20 11.0457 20 0Z" fill="url(#gl)"/>
            <defs>
              <linearGradient id="gl" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#EA4335"/>
                <stop offset="0.33" stop-color="#FBBC05"/>
                <stop offset="0.66" stop-color="#34A853"/>
                <stop offset="1" stop-color="#4285F4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <button type="button" class="gp-avatar" id="btnAvatar" aria-label="Account">S</button>
      </div>
    </div>

    <!-- Search match info bar (appears after search, stays subtle) -->
    <div class="gp-search-info-bar" id="searchInfoBar" style="display:none">
      <span class="gp-search-info-text" id="searchInfoText"></span>
    </div>

    <!-- Time Frame filter row (secondary, optional clue) -->
    <div class="gp-timeframe-row" id="timeframeRow">
      <span class="gp-timeframe-label">Time frame</span>
      <button type="button" class="gp-timeframe-btn" id="btnTimeframe" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="color:#5f6368">
          <path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/>
        </svg>
        <span id="timeframeBtnLabel">Any time</span>
        <svg class="gp-timeframe-chevron" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </button>
    </div>

    <!-- Active timeframe indicator pill (📅 Jun 2024 – Aug 2024 ×) -->
    <div class="gp-timeframe-active-row" id="timeframeActiveRow" style="display:none">
      <span class="gp-timeframe-active-pill" id="timeframeActivePill">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
          <path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/>
        </svg>
        <span id="timeframeActivePillText"></span>
        <button type="button" class="gp-timeframe-active-clear" id="btnClearTimeframe" aria-label="Remove time filter">×</button>
      </span>
    </div>

    <!-- Active search tag chips row -->
    <div class="gp-search-tags-row" id="searchTagsRow" style="display:none">
      <div class="gp-search-tags-list" id="searchTagsList"></div>
    </div>
  </header>

  <!-- ====================================================================
       TIME FRAME DROPDOWN PANEL (portal, positioned under the button)
       ==================================================================== -->
  <div class="gp-timeframe-dropdown" id="timeframeDropdown" role="menu" style="display:none">
    <div class="gp-tf-presets">
      <button type="button" class="gp-tf-option" data-preset="any">Any time</button>
      <button type="button" class="gp-tf-option" data-preset="today">Today</button>
      <button type="button" class="gp-tf-option" data-preset="week">This week</button>
      <button type="button" class="gp-tf-option" data-preset="month">This month</button>
      <button type="button" class="gp-tf-option" data-preset="year">This year</button>
      <button type="button" class="gp-tf-option" data-preset="last_year">Last year</button>
      <button type="button" class="gp-tf-option gp-tf-option-custom" data-preset="custom">Custom range…</button>
    </div>

    <!-- Custom range panel (shown when "Custom range" chosen) -->
    <div class="gp-tf-custom" id="tfCustomPanel" style="display:none">
      <div class="gp-tf-custom-divider"></div>
      <div class="gp-tf-custom-fields">
        <div class="gp-tf-field">
          <label class="gp-tf-field-label" for="tfFromDate">From</label>
          <input type="date" class="gp-tf-date-input" id="tfFromDate" />
        </div>
        <div class="gp-tf-field">
          <label class="gp-tf-field-label" for="tfToDate">To</label>
          <input type="date" class="gp-tf-date-input" id="tfToDate" />
        </div>
      </div>
      <button type="button" class="gp-tf-apply-btn" id="btnApplyCustom">Apply</button>
    </div>
  </div>

  <!-- ====================================================================
       SEARCH SUGGESTION OVERLAY (before search, shows above timeline)
       ==================================================================== -->
  <div class="gp-suggestions-overlay" id="suggestionsOverlay" style="display:none">
    <div class="gp-suggestions-inner">
      <div class="gp-suggestions-title">Try searching for</div>
      <div class="gp-suggestions-grid">
        <button class="gp-suggestion-chip" data-query="Goa">Goa</button>
        <button class="gp-suggestion-chip" data-query="café">café</button>
        <button class="gp-suggestion-chip" data-query="friends">friends</button>
        <button class="gp-suggestion-chip" data-query="beach">beach</button>
        <button class="gp-suggestion-chip" data-query="Goa café evening">Goa café evening</button>
        <button class="gp-suggestion-chip" data-query="sunset">sunset</button>
        <button class="gp-suggestion-chip" data-query="college night">college night</button>
        <button class="gp-suggestion-chip" data-query="birthday">birthday</button>
      </div>
    </div>
  </div>

  <!-- ====================================================================
       MAIN CHRONOLOGICAL PHOTO TIMELINE (always visible, never filtered)
       Search → Highlight photos IN-PLACE → NEXT MATCH navigation
       ==================================================================== -->
  <main class="gp-timeline" id="gpTimeline">
    <!-- Populated dynamically by JavaScript -->
    <!-- Photos stay in their original chronological positions -->
    <!-- Matching photos get a blue highlight glow/border in-place -->
  </main>

  <!-- ====================================================================
       MATCH NAVIGATOR (bottom bar, only visible when search is active)
       ← Previous    2 of 7    Next →
       ==================================================================== -->
  <div class="gp-match-navigator" id="matchNavigator" style="display:none">
    <button type="button" class="gp-nav-btn" id="btnPrevMatch" aria-label="Previous match" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
      <span>Previous</span>
    </button>
    <span class="gp-nav-counter" id="navCounter">1 of 3</span>
    <button type="button" class="gp-nav-btn gp-nav-btn-primary" id="btnNextMatch" aria-label="Next match">
      <span>Next</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
      </svg>
    </button>
  </div>

  <!-- ====================================================================
       FULLSCREEN PHOTO VIEWER (tap any photo)
       ==================================================================== -->
  <div class="gp-viewer" id="photoViewer" style="display:none">
    <div class="gp-viewer-header">
      <button type="button" class="gp-viewer-btn" id="btnViewerClose" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </button>
      <div class="gp-viewer-actions">
        <button type="button" class="gp-viewer-btn" aria-label="Share">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
          </svg>
        </button>
        <button type="button" class="gp-viewer-btn" aria-label="More">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="gp-viewer-img-wrap">
      <img id="viewerImg" class="gp-viewer-img" src="" alt="" />
    </div>
    <div class="gp-viewer-meta">
      <div class="gp-viewer-meta-date" id="viewerDate"></div>
      <div class="gp-viewer-meta-loc" id="viewerLoc"></div>
      <div class="gp-viewer-meta-tags" id="viewerTags"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
